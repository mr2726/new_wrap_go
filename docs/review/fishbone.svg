<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">WrapGo fishbone root-cause analysis</title><desc id="desc">Six cause categories converge on reliable and auditable campaign settlement not yet established. Evidence is from inspected source; runtime policies and operations are unverified.</desc><rect width="1600" height="850" fill="#080d12"/><style>text{font-family:Arial,sans-serif;fill:#e8edf2}.head{font-size:25px;font-weight:bold}.cat{font-size:22px;font-weight:bold;fill:#39ff14}.item{font-size:19px}.muted{font-size:17px;fill:#aebcc6}</style><text x="55" y="60" class="head">WrapGo · Fishbone root-cause analysis</text><text x="55" y="96" class="muted">Effect: reliable and auditable campaign settlement is not yet established · 15 October 2026</text><line x1="70" y1="425" x2="1260" y2="425" stroke="#39ff14" stroke-width="4"/><path d="M1260 345 L1535 345 L1535 505 L1260 505 L1200 425 Z" fill="#14251b" stroke="#39ff14" stroke-width="2"/><text x="1280" y="397" class="head">Settlement trust</text><text x="1280" y="431" class="head">not established</text><text x="1280" y="465" class="muted">Paid pilot gate</text><line x1="115" y1="285" x2="330" y2="425" stroke="#647b6e" stroke-width="2"/><text x="85" y="175" class="cat">Identity and access</text><text x="85" y="210" class="item">Server OTP step-up missing</text><text x="85" y="240" class="item">Live RLS not verified</text><text x="85" y="270" class="item">Public document URL design</text><line x1="500" y1="285" x2="715" y2="425" stroke="#647b6e" stroke-width="2"/><text x="470" y="175" class="cat">Workflow and ownership</text><text x="470" y="210" class="item">Split assignment writes</text><text x="470" y="240" class="item">Consent vs photo timestamp</text><text x="470" y="270" class="item">Fleet asset deletion</text><line x1="885" y1="285" x2="1100" y2="425" stroke="#647b6e" stroke-width="2"/><text x="855" y="175" class="cat">Measurement</text><text x="855" y="210" class="item">No zone polygon in stats</text><text x="855" y="240" class="item">Week history overwritten</text><text x="855" y="270" class="item">Mutable client totals</text><line x1="115" y1="570" x2="330" y2="425" stroke="#647b6e" stroke-width="2"/><text x="85" y="610" class="cat">Finance</text><text x="85" y="645" class="item">Raw card and CVV writes</text><text x="85" y="675" class="item">Client balance mutation</text><text x="85" y="705" class="item">Beneficiary model conflict</text><line x1="500" y1="570" x2="715" y2="425" stroke="#647b6e" stroke-width="2"/><text x="470" y="610" class="cat">Reliability</text><text x="470" y="645" class="item">Queue snapshot overwrite</text><text x="470" y="675" class="item">Sparse schema migrations</text><text x="470" y="705" class="item">Restore evidence missing</text><line x1="885" y1="570" x2="1100" y2="425" stroke="#647b6e" stroke-width="2"/><text x="855" y="610" class="cat">Operations and governance</text><text x="855" y="645" class="item">Install and review gates</text><text x="855" y="675" class="item">Status lacks runtime proof</text><text x="855" y="705" class="item">Unowned bank exceptions</text><text x="55" y="800" class="muted">Cause hypotheses and confirmed code behaviors are detailed in evidence.md; this diagram is not a production incident report.</text></svg>
